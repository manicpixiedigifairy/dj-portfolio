:root{
  --lilac:#B8B2EF;
  --cream:#FFF6F3;
  --ink:#1E1B2E;
  --icon:#262333;
  --big:min(23.5vw,40svh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--lilac);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;overflow:hidden}
a{color:inherit}

.cover{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;overflow:hidden;display:grid;place-items:center}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;transform:translateY(-3%)}

/* the title block: big word with the signature laid over it */
.title{position:relative;margin:0;display:grid;place-items:center}
.word{display:block;font-weight:600;font-size:var(--big);line-height:.82;letter-spacing:-.03em;color:var(--cream);user-select:none;padding-bottom:.08em;
  animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.name{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%) rotate(-5deg);white-space:nowrap;
  font-family:"Herr Von Muellerhoff",cursive;font-weight:400;font-size:calc(var(--big) * .44);line-height:1.3;color:var(--ink)}

/* handwriting: each line is revealed left to right, as if written by a pen */
.write{display:inline-block;padding:0 .25em;clip-path:inset(-20% 100% -20% 0);animation:pen var(--dur,1.8s) cubic-bezier(.55,.1,.4,1) var(--delay,0s) forwards}
@keyframes pen{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes rise{from{opacity:0;transform:translateY(.12em)}to{opacity:1;transform:none}}

.role{margin:clamp(2px,1svh,12px) 0 0;font-family:"Herr Von Muellerhoff",cursive;font-weight:400;font-size:clamp(34px,4.4vw,72px);line-height:1.2;color:var(--ink);transform:rotate(-3deg)}

/* explore button */
.explore{margin-top:clamp(14px,3svh,34px);display:inline-flex;align-items:center;gap:12px;padding:14px 26px 14px 30px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;
  font-weight:600;font-size:clamp(15px,1.15vw,18px);letter-spacing:.02em;box-shadow:0 10px 26px rgba(30,27,46,.25);
  opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) 3.4s forwards;transition:background-color .2s,color .2s,transform .2s}
.explore svg{width:18px;height:18px;transition:transform .25s}
.explore:hover{background:#fff;color:var(--ink);transform:translateY(-2px)}
.explore:hover svg{transform:translateX(4px)}
.explore:focus-visible{outline:3px solid #fff;outline-offset:4px}

/* sparkles: float, twinkle, follow the cursor a little */
.sky{position:absolute;inset:0;z-index:1;pointer-events:none}
.spark{position:absolute;width:var(--s,28px);height:var(--s,28px);color:#fff;
  transform:translate3d(calc(var(--mx,0) * var(--depth,1) * 1px),calc(var(--my,0) * var(--depth,1) * 1px),0);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.spark i{display:block;width:100%;height:100%;animation:float var(--f,7s) ease-in-out var(--d,0s) infinite alternate}
.spark svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,255,255,.7));
  animation:twinkle var(--t,3.6s) ease-in-out var(--d,0s) infinite,pop .7s cubic-bezier(.2,1.6,.4,1) calc(var(--d,0s) * .4 + .3s) both}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg);opacity:1}40%{transform:scale(.5) rotate(25deg);opacity:.5}55%{transform:scale(1.18) rotate(0deg);opacity:1}}
@keyframes float{from{translate:0 0}to{translate:var(--fx,6px) var(--fy,-14px)}}
@keyframes pop{from{scale:0}to{scale:1}}

/* shooting star */
.shoot{position:absolute;left:0;top:0;width:clamp(90px,10vw,160px);height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));opacity:0;transform-origin:100% 50%}
.shoot::after{content:"";position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8)}
.shoot.go{animation:shoot 1.1s cubic-bezier(.3,.1,.4,1) forwards}
@keyframes shoot{0%{opacity:0;transform:translate(var(--x0),var(--y0)) rotate(var(--a))}12%{opacity:1}100%{opacity:0;transform:translate(var(--x1),var(--y1)) rotate(var(--a))}}

/* menu */
.burger{position:fixed;top:clamp(18px,3.4svh,36px);right:clamp(18px,3vw,48px);z-index:20;width:52px;height:52px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;
  display:grid;place-items:center;transition:background-color .2s,color .2s}
.burger:hover{background:#fff;color:var(--ink)}
.burger:focus-visible{outline:3px solid #fff;outline-offset:4px}
.burger span{position:absolute;left:15px;right:15px;height:2px;border-radius:2px;background:currentColor;transition:transform .35s cubic-bezier(.6,.1,.3,1),opacity .2s}
.burger span:nth-child(1){transform:translateY(-6px)}
.burger span:nth-child(3){transform:translateY(6px)}
.menu-open .burger{background:#fff;color:var(--ink)}
.menu-open .burger span:nth-child(1){transform:rotate(45deg)}
.menu-open .burger span:nth-child(2){opacity:0}
.menu-open .burger span:nth-child(3){transform:rotate(-45deg)}

.menu{position:fixed;inset:0;z-index:15;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(28px,8vw,140px);
  clip-path:circle(0 at calc(100% - clamp(18px,3vw,48px) - 26px) calc(clamp(18px,3.4svh,36px) + 26px));visibility:hidden;
  transition:clip-path .7s cubic-bezier(.7,0,.2,1),visibility 0s .7s}
.menu-open .menu{clip-path:circle(150% at calc(100% - clamp(18px,3vw,48px) - 26px) calc(clamp(18px,3.4svh,36px) + 26px));visibility:visible;transition:clip-path .7s cubic-bezier(.7,0,.2,1)}
.menu ol{list-style:none;margin:0;padding:0;display:grid;gap:clamp(6px,1.4svh,16px)}
.menu li{opacity:0;transform:translateY(24px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.menu-open .menu li{opacity:1;transform:none;transition-delay:calc(.25s + var(--i) * .07s)}

<script>
(function () {
  var root = document.documentElement, body = document.body;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* menu */
  var burger = document.querySelector('.burger'), menu = document.getElementById('menu');
  function setMenu(open) {
    body.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', open);
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    menu.setAttribute('aria-hidden', !open);
    if (open) setTimeout(function () { var a = menu.querySelector('a'); if (a) a.focus(); }, 350);
  }
  burger.addEventListener('click', function () { setMenu(!body.classList.contains('menu-open')); });
  menu.querySelectorAll('[data-close]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); setMenu(false); burger.focus(); }); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && body.classList.contains('menu-open')) { setMenu(false); burger.focus(); } });

  if (reduce) return;

  /* stars drift gently toward the cursor */
  var sky = document.querySelector('.sky');
  addEventListener('pointermove', function (e) {
    var x = (e.clientX / innerWidth - .5) * 24, y = (e.clientY / innerHeight - .5) * 24;
    sky.style.setProperty('--mx', x.toFixed(1)); sky.style.setProperty('--my', y.toFixed(1));
  }, { passive: true });

  /* a shooting star every few seconds */
  var shoot = document.querySelector('.shoot');
  function launch() {
    var w = innerWidth, h = innerHeight, fromLeft = Math.random() < .5;
    var x0 = fromLeft ? w * (.05 + Math.random() * .3) : w * (.6 + Math.random() * .3), y0 = h * (.05 + Math.random() * .25);
    var dx = (fromLeft ? 1 : -1) * w * (.25 + Math.random() * .15), dy = h * (.18 + Math.random() * .12);
    var a = Math.atan2(dy, dx) * 180 / Math.PI;
    shoot.style.setProperty('--x0', x0 + 'px'); shoot.style.setProperty('--y0', y0 + 'px');
    shoot.style.setProperty('--x1', (x0 + dx) + 'px'); shoot.style.setProperty('--y1', (y0 + dy) + 'px');
    shoot.style.setProperty('--a', a + 'deg');
    shoot.classList.remove('go'); void shoot.offsetWidth; shoot.classList.add('go');
    setTimeout(launch, 4200 + Math.random() * 3800);
  }
  setTimeout(launch, 4000);
})();
</script>
