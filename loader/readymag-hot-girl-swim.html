<!-- Hot Girl Swim x Walmart case study for Readymag.
     Paste into a Code widget (Use iFrame off). It places the page full screen on top of
     Readymag's own scaling, so phones get the real mobile layout instead of a shrunken desktop. -->
<div id="hgs-anchor"></div>
<script>
(function () {
  var SRC = 'https://manicpixiedigifairy.github.io/dj-portfolio/hot-girl-swim/';
  var anchor = document.getElementById('hgs-anchor');
  var f = document.getElementById('hgs-frame');
  if (!f) {
    f = document.createElement('iframe');
    f.id = 'hgs-frame';
    f.src = SRC;
    f.title = 'Hot Girl Swim x Walmart case study';
    f.allow = 'autoplay; fullscreen';
    f.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;border:0;margin:0;z-index:2147483000;background:#0C1636';
    document.body.appendChild(f);
  }
  var html = document.documentElement, prev = html.style.overflow;
  html.style.overflow = 'hidden';
  /* if Readymag swaps to another page, take the case study down with it */
  var watch = setInterval(function () {
    if (!document.body.contains(anchor)) { clearInterval(watch); f.remove(); html.style.overflow = prev; }
  }, 500);
})();
</script>
